name: ${DEV_COMPOSE_PROJECT_NAME:-vue-dotnet-monorepo-dev}

services:
  backend:
    build:
      context: ..
      dockerfile: backend/VueDotnet.Api/Dockerfile
      target: development
    command:
      - dotnet
      - watch
      - --project
      - backend/VueDotnet.Api/VueDotnet.Api.csproj
      - --urls
      - http://0.0.0.0:5000
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      HEALTHCHECK_URL: http://127.0.0.1:5000/health
      NUGET_PACKAGES: /nuget/packages
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - ..:/workspace
      - backend_nuget:/nuget/packages
      - backend_api_bin:/workspace/backend/VueDotnet.Api/bin
      - backend_api_obj:/workspace/backend/VueDotnet.Api/obj
      - backend_tests_bin:/workspace/backend/VueDotnet.Api.Tests/bin
      - backend_tests_obj:/workspace/backend/VueDotnet.Api.Tests/obj
    healthcheck:
      test:
        - CMD
        - dotnet
        - backend/VueDotnet.Api/bin/Debug/net10.0/VueDotnet.Api.dll
        - --healthcheck
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 12

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      target: development
    environment:
      VITE_PROXY_TARGET: http://backend:5000
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-false}
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1:5173/
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 12

volumes:
  backend_nuget:
  backend_api_bin:
  backend_api_obj:
  backend_tests_bin:
  backend_tests_obj:
  frontend_node_modules:
