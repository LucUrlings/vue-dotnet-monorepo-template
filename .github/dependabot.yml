version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      root-development-tools:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # Keep runtime types aligned with the template's Node 24 LTS target.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # Upgrade TypeScript majors with the lint toolchain after peer support lands.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      vue:
        patterns:
          - "vue"
          - "vue-router"
          - "pinia"
          - "@vue/*"
          - "@pinia/*"
      frontend-tooling:
        dependency-type: development
        patterns:
          - "*"

  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      # ASP.NET Core 10's OpenAPI generator currently requires the 2.x API.
      - dependency-name: Microsoft.OpenApi
        update-types:
          - version-update:semver-major
    groups:
      dotnet:
        patterns:
          - "Microsoft.*"
      test-tooling:
        patterns:
          - "xunit*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # Node major upgrades are an explicit template/toolchain decision.
      - dependency-name: node
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker
    directory: /backend/VueDotnet.Api
    schedule:
      interval: weekly
