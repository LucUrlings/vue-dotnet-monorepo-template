name: ${COMPOSE_PROJECT_NAME:-vue-dotnet-monorepo}

services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/lucurlings/vue-dotnet-monorepo-template-backend}:${IMAGE_TAG:-latest}
    pull_policy: always
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_HTTP_PORTS: "8080"
      HEALTHCHECK_URL: http://127.0.0.1:8080/health
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      - application
    healthcheck:
      test: ["CMD", "dotnet", "VueDotnet.Api.dll", "--healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/lucurlings/vue-dotnet-monorepo-template-frontend}:${IMAGE_TAG:-latest}
    pull_policy: always
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped
    networks:
      - application
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1/healthz
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

networks:
  application:
    driver: bridge
