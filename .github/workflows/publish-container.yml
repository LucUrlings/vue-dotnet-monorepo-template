name: Publish containers

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: Tag to publish (for example, preview-2026-07-25)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FRONTEND_IMAGE: local/vue-dotnet-monorepo-frontend
      BACKEND_IMAGE: local/vue-dotnet-monorepo-backend
      IMAGE_TAG: validation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Version tags must use SemVer, for example v1.2.3 or v1.2.3-rc.1." >&2
            exit 1
          fi
      - name: Require version tags at the current main commit
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags --depth=1 origin main
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)" || {
            echo "Version tags must point to the current main commit so latest cannot move backwards." >&2
            exit 1
          }
      - name: Validate manual tag
        if: github.event_name == 'workflow_dispatch'
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,127}$ ]]; then
            echo "image_tag is not a valid OCI tag" >&2
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Install locked dependencies
        run: npm run setup
      - name: Audit dependencies
        run: |
          npm audit
          npm audit --prefix frontend
          dotnet list backend/VueDotnet.sln package --vulnerable --include-transitive
      - name: Run complete source checks
        run: npm run check
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Validate Compose files
        run: |
          docker compose -f docker/compose.dev.yml config --quiet
          docker compose -f docker/compose.server.yml config --quiet
          docker compose -f docker/compose.server.yml -f docker/compose.build.yml config --quiet
          docker compose -f docker/compose.server.yml -f docker/compose.debug.yml config --quiet
      - name: Build development images
        run: docker compose -f docker/compose.dev.yml build

  build:
    name: Build ${{ matrix.component }} (${{ matrix.architecture }})
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: frontend
            platform: linux/amd64
            architecture: amd64
          - component: frontend
            platform: linux/arm64
            architecture: arm64
          - component: backend
            platform: linux/amd64
            architecture: amd64
          - component: backend
            platform: linux/arm64
            architecture: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve package name
        id: package
        env:
          COMPONENT: ${{ matrix.component }}
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${COMPONENT}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate OCI metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.package.outputs.name }}
          labels: |
            org.opencontainers.image.title=VueDotnet Monorepo ${{ matrix.component }}
            org.opencontainers.image.description=Production ${{ matrix.component }} image for the VueDotnet Monorepo template
            org.opencontainers.image.licenses=MIT
          tags: |
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{major}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
      - name: Build and push by digest
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.component == 'frontend' && 'frontend/Dockerfile' || 'backend/VueDotnet.Api/Dockerfile' }}
          target: production
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.package.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ matrix.architecture }}
      - name: Save platform digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${IMAGE_DIGEST#sha256:}"
      - name: Upload platform digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.component }}-${{ matrix.architecture }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  scan:
    name: Assemble and scan ${{ matrix.component }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component:
          - frontend
          - backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve package name
        id: package
        env:
          COMPONENT: ${{ matrix.component }}
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${COMPONENT}" >> "$GITHUB_OUTPUT"
      - name: Download platform digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-${{ matrix.component }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble SHA candidate
        id: candidate
        env:
          PACKAGE: ${{ steps.package.outputs.name }}
        run: |
          sources=()
          for digest_file in "$RUNNER_TEMP"/digests/*; do
            sources+=("${PACKAGE}@sha256:$(basename "$digest_file")")
          done
          test "${#sources[@]}" -eq 2

          docker buildx imagetools create \
            --tag "${PACKAGE}:sha-${GITHUB_SHA}" \
            --metadata-file "$RUNNER_TEMP/candidate.json" \
            "${sources[@]}"

          digest="$(
            jq --raw-output \
              '."containerimage.descriptor".digest' \
              "$RUNNER_TEMP/candidate.json"
          )"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Scan amd64 candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ steps.package.outputs.name }}@${{ steps.candidate.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Scan arm64 candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ steps.package.outputs.name }}@${{ steps.candidate.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Save scanned manifest digest
        env:
          MANIFEST_DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/manifest"
          touch "$RUNNER_TEMP/manifest/${MANIFEST_DIGEST#sha256:}"
      - name: Upload scanned manifest digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manifest-${{ matrix.component }}
          path: ${{ runner.temp }}/manifest/*
          if-no-files-found: error
          retention-days: 1

  smoke:
    name: Smoke-test scanned images
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    env:
      FRONTEND_PORT: 8080
      IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve package names
        run: |
          echo "FRONTEND_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-frontend" >> "$GITHUB_ENV"
          echo "BACKEND_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-backend" >> "$GITHUB_ENV"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start scanned production stack
        run: docker compose -f docker/compose.server.yml up -d --wait --wait-timeout 90
      - name: Verify scanned production stack
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/api/status
          curl --fail --silent --show-error http://127.0.0.1:8080/about > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/healthz
          curl --fail --silent --show-error --head http://127.0.0.1:8080/ |
            grep --ignore-case --quiet '^x-content-type-options: nosniff'

          backend_container="$(
            docker compose \
              -f docker/compose.server.yml \
              ps --quiet backend
          )"
          test "$(docker inspect --format '{{.Config.User}}' "$backend_container")" = "app"
          docker inspect "$backend_container" |
            jq --exit-status '.[0].NetworkSettings.Ports["8080/tcp"] == null'

          docker compose -f docker/compose.server.yml restart backend

          recovered=false
          for _ in {1..12}; do
            if curl --max-time 3 --fail --silent \
              http://127.0.0.1:8080/api/status > /dev/null; then
              recovered=true
              break
            fi
            sleep 2
          done
          test "$recovered" = true
      - name: Stop production stack
        if: always()
        run: docker compose -f docker/compose.server.yml down --remove-orphans

  publish:
    name: Promote ${{ matrix.component }}
    needs:
      - scan
      - smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component:
          - frontend
          - backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve package name
        id: package
        env:
          COMPONENT: ${{ matrix.component }}
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${COMPONENT}" >> "$GITHUB_OUTPUT"
      - name: Download scanned manifest digest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: manifest-${{ matrix.component }}
          path: ${{ runner.temp }}/manifest
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.package.outputs.name }}
          tags: |
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{major}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
      - name: Promote scanned digest
        id: promote
        env:
          METADATA_JSON: ${{ steps.metadata.outputs.json }}
          PACKAGE: ${{ steps.package.outputs.name }}
        run: |
          manifest_files=("$RUNNER_TEMP"/manifest/*)
          test "${#manifest_files[@]}" -eq 1
          manifest_digest="sha256:$(basename "${manifest_files[0]}")"

          mapfile -t tags < <(jq --raw-output '.tags[]' <<< "$METADATA_JSON")
          test "${#tags[@]}" -gt 0

          tag_arguments=()
          for tag in "${tags[@]}"; do
            tag_arguments+=("--tag" "$tag")
          done

          docker buildx imagetools create \
            "${tag_arguments[@]}" \
            --metadata-file "$RUNNER_TEMP/promoted.json" \
            "${PACKAGE}@${manifest_digest}"

          promoted_digest="$(
            jq --raw-output \
              '."containerimage.descriptor".digest' \
              "$RUNNER_TEMP/promoted.json"
          )"
          test "$promoted_digest" = "$manifest_digest"

          for tag in "${tags[@]}"; do
            tag_digest="$(
              docker buildx imagetools inspect "$tag" \
                --format '{{json .Manifest}}' |
                jq --raw-output '.digest'
            )"
            test "$tag_digest" = "$manifest_digest"
          done

          echo "digest=$manifest_digest" >> "$GITHUB_OUTPUT"
      - name: Publish summary
        env:
          DIGEST: ${{ steps.promote.outputs.digest }}
          PACKAGE: ${{ steps.package.outputs.name }}
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          {
            echo "### Published ${PACKAGE}"
            echo
            echo "Scanned and promoted digest: \`${DIGEST}\`"
            echo
            echo '```text'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
