version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      root-development-tools:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      vue:
        patterns:
          - "vue"
          - "vue-router"
          - "pinia"
          - "@vue/*"
          - "@pinia/*"
      frontend-tooling:
        dependency-type: development
        patterns:
          - "*"

  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
    groups:
      dotnet:
        patterns:
          - "Microsoft.*"
      test-tooling:
        patterns:
          - "xunit*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /backend/VueDotnet.Api
    schedule:
      interval: weekly
